<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI 3D Comic - Interaktif</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', 'Impact', sans-serif;
            background-color: #0a0a1a;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 40px;
            border: 3px solid #ffdd00;
            box-shadow: 0 0 20px rgba(255,221,0,0.6);
            z-index: 100;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #aa0000;
            font-size: 1.2rem;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        #info span {
            color: #ffdd00;
            font-style: italic;
        }
        .comic-bubble {
            position: absolute;
            background: white;
            color: black;
            border: 4px solid black;
            border-radius: 40px;
            padding: 18px 30px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.6);
            max-width: 300px;
            text-align: center;
            z-index: 200;
            pointer-events: none;
            transition: transform 0.2s;
            line-height: 1.3;
        }
        .comic-bubble::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 40px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 30px solid black;
            filter: drop-shadow(2px 4px 0 rgba(0,0,0,0.4));
        }
        .comic-bubble::before {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 45px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 24px solid white;
            z-index: 1;
        }
        #bubble1 {
            top: 15%;
            left: 10%;
            transform: rotate(-5deg);
            background: #fff9c4;
            border-color: #222;
        }
        #bubble2 {
            bottom: 20%;
            right: 8%;
            transform: rotate(5deg);
            background: #ffeb3b;
            border-color: #222;
            border-radius: 50px;
        }
        #bubble2::after {
            left: auto;
            right: 40px;
            border-top-color: #222;
        }
        #bubble2::before {
            left: auto;
            right: 45px;
            border-top-color: #ffeb3b;
        }
        .comic-effect {
            position: absolute;
            font-size: 3rem;
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: #ff3333;
            text-shadow: 4px 4px 0 #000, 8px 8px 0 rgba(0,0,0,0.3);
            transform: rotate(-15deg);
            z-index: 150;
            pointer-events: none;
            opacity: 0.9;
            letter-spacing: 4px;
        }
        #effect1 {
            top: 10%;
            right: 15%;
            font-size: 4rem;
            color: #ffaa00;
            text-shadow: 4px 4px 0 #aa0000;
            transform: rotate(10deg);
        }
        #effect2 {
            bottom: 10%;
            left: 5%;
            font-size: 5rem;
            color: #00ccff;
            text-shadow: 4px 4px 0 #003366;
            transform: rotate(-5deg);
        }
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 300;
            mix-blend-mode: overlay;
        }
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 250;
        }
        @media (max-width: 600px) {
            .comic-bubble { font-size: 1rem; padding: 12px 18px; max-width: 200px; }
            #effect1 { font-size: 2.5rem; }
            #effect2 { font-size: 3rem; }
            #info { font-size: 0.9rem; padding: 8px 16px; }
        }
    </style>
</head>
<body>
    <div id="info">🤖 <span>AI 3D COMIC</span> • INTERAKTIF • KARYA DIGITAL</div>
    
    <!-- Komik bubble -->
    <div id="bubble1" class="comic-bubble">HALO! AKU AI 3D! 👋</div>
    <div id="bubble2" class="comic-bubble">KEREN BANGET! 🔥</div>
    
    <!-- Efek komik -->
    <div id="effect1" class="comic-effect">POW!</div>
    <div id="effect2" class="comic-effect">WOW!</div>
    
    <!-- Overlay efek -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Three.js dari CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Inisialisasi Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        // Tambahkan sedikit gradien dengan fog
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);

        // --- Kamera ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 18);
        camera.lookAt(0, 2, 0);

        // --- Renderer WebGL ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- CSS2DRenderer untuk teks komik 3D (opsional, kita pakai bubble HTML tapi ini untuk tambahan) ---
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // agar tidak mengganggu interaksi
        document.body.appendChild(labelRenderer.domElement);

        // --- Kontrol Orbit dengan auto-rotate ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.8;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 8;
        controls.maxDistance = 30;
        controls.target.set(0, 2, 0);

        // --- Pencahayaan ---

        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Main directional light (seperti matahari)
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 15;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 25;
        scene.add(dirLight);

        // Fill light dari belakang dengan warna komik
        const backLight = new THREE.PointLight(0x4466ff, 0.8);
        backLight.position.set(-5, 3, -10);
        scene.add(backLight);

        // Rim light
        const rimLight = new THREE.PointLight(0xffaa00, 0.6);
        rimLight.position.set(10, 5, -5);
        scene.add(rimLight);

        // Warna warni spotlight untuk efek komik
        const colorLight1 = new THREE.PointLight(0xff00ff, 0.4);
        colorLight1.position.set(8, 6, 5);
        scene.add(colorLight1);
        const colorLight2 = new THREE.PointLight(0x00ffff, 0.4);
        colorLight2.position.set(-8, 4, 8);
        scene.add(colorLight2);

        // --- Membuat Karakter AI 3D (Robot/Komik) ---

        // Group untuk karakter utama
        const aiCharacter = new THREE.Group();

        // Badan (kubus dengan sudut tumpul)
        const bodyGeo = new THREE.BoxGeometry(2.4, 2.8, 1.8);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x3a6ea5, 
            emissive: 0x112244,
            roughness: 0.3,
            metalness: 0.2,
            flatShading: false
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.y = 1.6;
        aiCharacter.add(body);

        // Kepala (sphere dengan aksen)
        const headGeo = new THREE.SphereGeometry(1.1, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({ 
            color: 0xffaa33, 
            emissive: 0x442200,
            roughness: 0.4,
            metalness: 0.1
        });
        const head = new THREE.Mesh(headGeo, headMat);
        head.castShadow = true;
        head.receiveShadow = true;
        head.position.y = 3.4;
        aiCharacter.add(head);

        // Mata kiri (cylinder dengan ujung sphere)
        const eyeGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 });
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-0.45, 3.6, 1.0);
        eyeL.castShadow = true;
        aiCharacter.add(eyeL);
        
        // Mata kanan
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(0.45, 3.6, 1.0);
        eyeR.castShadow = true;
        aiCharacter.add(eyeR);

        // Pupil kiri
        const pupilGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
        pupilL.position.set(-0.45, 3.6, 1.25);
        aiCharacter.add(pupilL);
        
        // Pupil kanan
        const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
        pupilR.position.set(0.45, 3.6, 1.25);
        aiCharacter.add(pupilR);

        // Mulut (torus)
        const mouthGeo = new THREE.TorusGeometry(0.3, 0.08, 8, 20, Math.PI);
        const mouthMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const mouth = new THREE.Mesh(mouthGeo, mouthMat);
        mouth.rotation.x = Math.PI / 2;
        mouth.rotation.z = Math.PI;
        mouth.position.set(0, 3.2, 1.15);
        mouth.scale.set(0.8, 0.8, 0.8);
        aiCharacter.add(mouth);

        // Antena
        const antennaGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 8);
        const antennaMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x552200 });
        const antenna = new THREE.Mesh(antennaGeo, antennaMat);
        antenna.position.set(0, 4.4, 0);
        antenna.castShadow = true;
        aiCharacter.add(antenna);
        
        const antennaBallGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const antennaBallMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0x440000 });
        const antennaBall = new THREE.Mesh(antennaBallGeo, antennaBallMat);
        antennaBall.position.set(0, 4.9, 0);
        antennaBall.castShadow = true;
        aiCharacter.add(antennaBall);

        // Lengan kiri
        const armGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.8, 8);
        const armMat = new THREE.MeshStandardMaterial({ color: 0x3a6ea5 });
        const armL = new THREE.Mesh(armGeo, armMat);
        armL.position.set(-1.8, 2.4, 0);
        armL.rotation.z = 0.4;
        armL.rotation.x = 0.2;
        armL.castShadow = true;
        armL.receiveShadow = true;
        aiCharacter.add(armL);

        // Tangan kiri (sphere)
        const handGeo = new THREE.SphereGeometry(0.45, 16, 16);
        const handMat = new THREE.MeshStandardMaterial({ color: 0xffaa33 });
        const handL = new THREE.Mesh(handGeo, handMat);
        handL.position.set(-2.3, 1.6, 0.1);
        handL.castShadow = true;
        aiCharacter.add(handL);

        // Lengan kanan
        const armR = new THREE.Mesh(armGeo, armMat);
        armR.position.set(1.8, 2.4, 0);
        armR.rotation.z = -0.4;
        armR.rotation.x = -0.2;
        armR.castShadow = true;
        armR.receiveShadow = true;
        aiCharacter.add(armR);

        // Tangan kanan
        const handR = new THREE.Mesh(handGeo, handMat);
        handR.position.set(2.3, 1.6, -0.1);
        handR.castShadow = true;
        aiCharacter.add(handR);

        // Kaki kiri
        const legGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x2a4a7a });
        const legL = new THREE.Mesh(legGeo, legMat);
        legL.position.set(-0.7, 0.4, 0);
        legL.castShadow = true;
        legL.receiveShadow = true;
        aiCharacter.add(legL);

        // Kaki kanan
        const legR = new THREE.Mesh(legGeo, legMat);
        legR.position.set(0.7, 0.4, 0);
        legR.castShadow = true;
        legR.receiveShadow = true;
        aiCharacter.add(legR);

        // Sepatu kiri
        const shoeGeo = new THREE.BoxGeometry(0.7, 0.3, 1.3);
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0xaa3333 });
        const shoeL = new THREE.Mesh(shoeGeo, shoeMat);
        shoeL.position.set(-0.7, -0.2, 0.2);
        shoeL.castShadow = true;
        shoeL.receiveShadow = true;
        aiCharacter.add(shoeL);
        
        // Sepatu kanan
        const shoeR = new THREE.Mesh(shoeGeo, shoeMat);
        shoeR.position.set(0.7, -0.2, 0.2);
        shoeR.castShadow = true;
        shoeR.receiveShadow = true;
        aiCharacter.add(shoeR);

        // Detail dada (lingkaran)
        const chestGeo = new THREE.TorusGeometry(0.5, 0.1, 8, 20);
        const chestMat = new THREE.MeshStandardMaterial({ color: 0xffdd00, emissive: 0x442200 });
        const chest = new THREE.Mesh(chestGeo, chestMat);
        chest.rotation.x = Math.PI / 2;
        chest.position.set(0, 2.4, 0.95);
        chest.scale.set(0.8, 0.8, 0.8);
        aiCharacter.add(chest);

        // Tambahkan karakter ke scene
        scene.add(aiCharacter);

        // Posisi awal karakter
        aiCharacter.position.set(0, 1.2, 0);
        aiCharacter.rotation.y = 0.2;

        // --- Efek Partikel di sekitar karakter ---
        const particleCount = 800;
        const particlesGeo = new THREE.BufferGeometry();
        const particlesPos = new Float32Array(particleCount * 3);
        const particlesColor = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // Posisi acak dalam bola
            const radius = 4 + Math.random() * 6;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            const x = Math.sin(phi) * Math.cos(theta) * radius;
            const y = Math.sin(phi) * Math.sin(theta) * radius * 0.8 + 2;
            const z = Math.cos(phi) * radius;
            
            particlesPos[i*3] = x;
            particlesPos[i*3+1] = y;
            particlesPos[i*3+2] = z;
            
            // Warna-warni cerah
            const color = new THREE.Color().setHSL(Math.random(), 1.0, 0.6);
            particlesColor[i*3] = color.r;
            particlesColor[i*3+1] = color.g;
            particlesColor[i*3+2] = color.b;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPos, 3));
        particlesGeo.setAttribute('color', new THREE.BufferAttribute(particlesColor, 3));

        const particlesMat = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        // --- Efek Garis Komik (Burst) ---
        const burstGroup = new THREE.Group();
        const burstMat = new THREE.LineBasicMaterial({ color: 0xffaa00 });
        for (let i = 0; i < 24; i++) {
            const angle = (i / 24) * Math.PI * 2;
            const length = 3.5 + Math.random() * 2;
            const points = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(Math.cos(angle) * length, Math.sin(angle) * length, 0)
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, burstMat);
            line.position.set(0, 2.5, -2);
            burstGroup.add(line);
        }
        scene.add(burstGroup);

        // --- Lantai / Panggung bergaya komik ---
        const floorGeo = new THREE.CylinderGeometry(6, 6, 0.5, 32);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a4a, 
            emissive: 0x111122,
            roughness: 0.7,
            metalness: 0.1
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.set(0, -1.2, 0);
        floor.receiveShadow = true;
        floor.castShadow = true;
        scene.add(floor);

        // Ring di lantai
        const ringGeo = new THREE.TorusGeometry(3.5, 0.1, 16, 64);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xffdd00, emissive: 0x442200 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.set(0, -0.9, 0);
        scene.add(ring);

        // --- Bintang-bintang latar belakang (untuk komik) ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 400;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 200;
            starPos[i+1] = (Math.random() - 0.5) * 200;
            starPos[i+2] = (Math.random() - 0.5) * 200 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- Animasi & Interaksi ---

        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() * 0.001;

            // Animasi karakter: gerakan mengambang dan rotasi kecil
            if (aiCharacter) {
                aiCharacter.position.y = 1.2 + Math.sin(elapsedTime * 2) * 0.15;
                aiCharacter.rotation.y = 0.2 + Math.sin(elapsedTime * 0.5) * 0.1;
                
                // Animasi lengan
                const leftArm = aiCharacter.children.find(child => child.position.x < -1.5 && child.geometry && child.geometry.type === 'CylinderGeometry');
                const rightArm = aiCharacter.children.find(child => child.position.x > 1.5 && child.geometry && child.geometry.type === 'CylinderGeometry');
                if (leftArm) {
                    leftArm.rotation.z = 0.4 + Math.sin(elapsedTime * 3) * 0.2;
                    leftArm.rotation.x = 0.2 + Math.cos(elapsedTime * 2) * 0.2;
                }
                if (rightArm) {
                    rightArm.rotation.z = -0.4 + Math.sin(elapsedTime * 3 + 2) * 0.2;
                    rightArm.rotation.x = -0.2 + Math.cos(elapsedTime * 2 + 2) * 0.2;
                }

                // Animasi antena bola
                const antennaBallMesh = aiCharacter.children.find(child => child.position.y > 4.7 && child.geometry && child.geometry.type === 'SphereGeometry');
                if (antennaBallMesh) {
                    antennaBallMesh.scale.setScalar(1 + Math.sin(elapsedTime * 10) * 0.1);
                }
            }

            // Animasi partikel berputar
            particles.rotation.y += 0.0005;
            particles.rotation.x += 0.0002;

            // Animasi burst group
            burstGroup.rotation.z += 0.002;
            burstGroup.rotation.x = Math.sin(elapsedTime * 0.5) * 0.1;

            // Animasi bintang
            stars.rotation.y += 0.0001;

            // Update kontrol
            controls.update();

            // Render
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        animate();

        // --- Resize Handler ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Sedikit interaksi klik untuk efek komik ---
        window.addEventListener('click', () => {
            // Efek zoom kecil atau perubahan warna
            const bubble1 = document.getElementById('bubble1');
            const bubble2 = document.getElementById('bubble2');
            bubble1.style.transform = 'rotate(-8deg) scale(1.1)';
            bubble2.style.transform = 'rotate(8deg) scale(1.1)';
            setTimeout(() => {
                bubble1.style.transform = 'rotate(-5deg) scale(1)';
                bubble2.style.transform = 'rotate(5deg) scale(1)';
            }, 200);
            
            // Partikel meledak sebentar
            particles.material.size = 0.3;
            setTimeout(() => {
                particles.material.size = 0.15;
            }, 150);
        });

        // Tampilkan pesan selamat datang di console
        console.log('🤖 AI 3D Comic siap! Klik atau sentuh untuk efek komik.');
    </script>
</body>
</html>
